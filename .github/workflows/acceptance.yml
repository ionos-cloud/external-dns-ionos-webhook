name: Acceptance Tests (kind)

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'deployments/**'
      - 'scripts/**'
      - 'test/hurl/**'
      - 'Dockerfile'
      - 'localbuild.Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'deployments/**'
      - 'scripts/**'
      - 'test/hurl/**'
      - 'Dockerfile'
      - 'localbuild.Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
      - name: Setup kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Setup Helm
        uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Install hurl
        run: |
          curl -sSL -o /tmp/hurl.deb https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          echo "e76e6c0957f83f9b761416452871554d0f068384b6cd004bff82dd8795c62225  /tmp/hurl.deb" | sha256sum -c -
          sudo dpkg -i /tmp/hurl.deb
      - name: Add helm repos
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update
      - name: Deploy on kind
        run: scripts/deploy_on_kind.sh
      - name: Run acceptance tests
        run: scripts/acceptance-tests.sh
      - name: Dump external-dns/webhook logs on failure
        if: failure()
        run: |
          kubectl get pods -n default -o wide
          kubectl describe pod -n default -l app.kubernetes.io/instance=external-dns-ionos
          kubectl logs deployment/external-dns-ionos -n default --all-containers --prefix --tail=-1
          kubectl logs deployment/external-dns-ionos -n default -c external-dns --previous --tail=-1 || true
      - name: Upload hurl report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hurl-acceptance-report
          path: ./build/reports/hurl/**
