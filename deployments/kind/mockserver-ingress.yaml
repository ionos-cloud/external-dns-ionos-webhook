apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mockserver
  namespace: mockserver
spec:
  ingressClassName: nginx
  rules:
    - host: dns-mockserver.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mockserver
                port:
                  number: 1080
